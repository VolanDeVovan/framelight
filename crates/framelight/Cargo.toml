[package]
name = "framelight"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Streams the Steam Frame's Headset View to browsers; the headset binary"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fl-core.workspace = true
fl-encode = { path = "../fl-encode" }
fl-capture = { path = "../fl-capture" }
fl-webrtc = { path = "../fl-webrtc" }
fl-audio = { path = "../fl-audio" }
libc = "0.2"
# The switch window: X11 spoken directly over the socket (no libX11/libxcb on the
# device) and an 8x8 bitmap font compiled in.
x11rb = { version = "0.13", default-features = false }
font8x8 = { version = "0.3", default-features = false }
