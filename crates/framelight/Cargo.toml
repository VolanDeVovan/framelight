[package]
name = "framelight"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Streams the Steam Frame's Headset View to browsers; the headset binary"

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fl-core.workspace = true
fl-encode = { path = "../fl-encode" }
fl-capture = { path = "../fl-capture" }
fl-webrtc = { path = "../fl-webrtc" }
fl-audio = { path = "../fl-audio" }
libc = "0.2"
# The switch window. OpenGL through glow (no wgpu); winit and glutin dlopen libX11,
# libxkbcommon, libEGL and libGL, so the binary still links none of them. X11 only:
# gamescope gives its clients nothing else. The fonts are bundled, hence no defaults.
eframe = { version = "0.37", default-features = false, features = ["glow", "x11"] }

[dev-dependencies]
# Runs the window's UI headless (no display, no GPU) and exposes what it laid out.
egui_kittest = "0.37"
